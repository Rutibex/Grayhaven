<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greyhaven — Original art proof</title>
<style>*{box-sizing:border-box}body{margin:0;background:#11191c;color:#e8dfc7;font:14px Georgia,serif}header{height:60px;display:flex;align-items:center;gap:15px;padding:8px 22px;background:#19252a;border-bottom:1px solid #796749}strong{color:#d6b77c;letter-spacing:3px}label{font:12px system-ui;color:#aab9ba}select,button{background:#26343a;color:#eee5d5;border:1px solid #75694f;padding:5px}button{cursor:pointer}#stage{display:block;margin:auto;width:min(100vw,calc((100vh - 60px)*1.6));height:auto;touch-action:none}#loading{padding:30px}a{color:#d6b77c}</style>
<header><strong>GREYHAVEN</strong><label>Art & animation proof</label><label>Outfit <select id="outfit"><option value="humanoid">Ranger</option><option value="armor">Gambeson</option><option value="teal">Teal cloth mask</option></select></label><label>Clip <select id="clip"><option>idle</option><option>walk</option><option>attack</option><option>cast</option></select></label><label>Facing <select id="dir"></select></label><button id="actor">Tidehound</button><button id="pause">Pause</button><label><input type="checkbox" id="pivots"> Pivots</label></header>
<div id="loading">Loading original cutout atlases…</div><canvas id="stage" width="1280" height="800" hidden aria-label="Interactive eight-facing art, inventory and animation proof"></canvas>
<script>
const manifest=/*MANIFEST*/,sources=/*IMAGES*/;
/*MODEL*/
const model=window.proof=new ProofModel(),images={},canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let pivots=false,keys=new Set();
function drawImage(name,x,y,w,h){const d=manifest.images[name],im=images[d?.image];if(im)ctx.drawImage(im,x,y,w||d.size[0],h||d.size[1]);}
function actor(id,d,clip,x,y,scale=1,time=model.time){const a=manifest.actors[id],dd=a.directions[['N','NE','E','SE','S','SW','W','NW'][d]];let c=dd[clip]||dd.attack;const index=c.start+Math.floor(time*c.fps)%c.count;ctx.drawImage(images[a.image],index%16*128,Math.floor(index/16)*128,128,128,x-64*scale,y-112*scale,128*scale,128*scale);if(pivots){ctx.strokeStyle='#ffdb68';ctx.beginPath();ctx.moveTo(x-5,y);ctx.lineTo(x+5,y);ctx.moveTo(x,y-5);ctx.lineTo(x,y+5);ctx.stroke();}}
function text(s,x,y,color='#e8dfc7',font='14px Georgia'){ctx.fillStyle=color;ctx.font=font;ctx.fillText(s,x,y);}
function frame(){ctx.fillStyle='#15252c';ctx.fillRect(0,0,1280,800);ctx.fillStyle='#1d3035';ctx.fillRect(0,0,1280,55);text('THE GREYHAVEN WORKSHOP',25,30,'#d7b57b','18px Georgia');text('Original 2D cutouts · tile-authoritative movement · interchangeable equipment',360,29,'#b6c6c6','13px system-ui');
 for(let n=-12;n<=12;n++)for(let x=-6;x<=6;x++){let y=n-x;if(y< -6||y>6)continue;let p=model.project(x,y),tile=Math.abs(x)>5||Math.abs(y)>5?'water':x===1||y===-1?'dirt':'grass';drawImage(tile,p.x-22,p.y-22);}
 let objects=[{type:'prop',name:'tree',x:-4,y:-1},{type:'prop',name:'wall-left',x:2,y:-3},{type:'prop',name:'door',x:3,y:-3},{type:'prop',name:'chest',x:-3,y:2},{type:'prop',name:'lantern',x:3,y:1},{type:'prop',name:'shrub',x:4,y:3},{type:'monster',x:-2,y:2},...model.items.filter(i=>i.where==='ground'&&model.drag?.item!==i).map(i=>({type:'item',item:i,x:i.x,y:i.y})),{type:'hero',...model.position()}];
 objects.sort((a,b)=>(a.x+a.y)-(b.x+b.y));for(const o of objects){let p=model.project(o.x,o.y);if(o.type==='prop'){const d=manifest.images[o.name];drawImage(o.name,p.x-d.size[0]/2,p.y-d.size[1]+10);}if(o.type==='monster')actor('tidehound',5,'idle',p.x,p.y);if(o.type==='hero')actor(model.actor(),model.direction,model.walking?'walk':model.clip,p.x,p.y);if(o.type==='item')drawImage(o.item.icon,p.x-18,p.y-18,36,36);}
 for(let d=0;d<8;d++)actor(model.actor(),d,model.clip,55+d*105,690,.85);
 text('EIGHT FACING INSPECTOR',26,582,'#d7b57b','13px system-ui');for(let d=0;d<8;d++)text(['N','NE','E','SE','S','SW','W','NW'][d],47+d*105,717,'#99b5bb','12px system-ui');
 for(const p of model.panels){ctx.fillStyle='#071014b0';ctx.fillRect(p.x+7,p.y+8,p.w,p.h);drawImage({bag:'backpack',doll:'paperdoll',book:'spellbook'}[p.id],p.x,p.y,p.w,p.h);ctx.fillStyle='#152228eb';ctx.fillRect(p.x,p.y,p.w,30);text(p.id==='bag'?'BACKPACK':p.id==='doll'?'PAPERDOLL':'THE TIDAL GRIMOIRE',p.x+14,p.y+21,'#dcc18d','13px Georgia');
 if(p.id==='doll'){actor(model.monster?'humanoid-h1-s1-b1':model.actor(),model.direction,'idle',p.x+130,p.y+285,1.5);text('The Wayfarer',p.x+55,p.y+374,'#1a221e');}
 if(p.id==='book'){for(let i=0;i<8;i++){let col=i%2,row=Math.floor(i/2),name=['dawn','storm','ember','renew','ward','venom','bind','gate'][i];drawImage('spell-'+name,p.x+35+col*190,p.y+61+row*52,36,36);text(name,p.x+77+col*190,p.y+84+row*52,'#3d3024','14px Georgia');}}
 for(const it of model.items){if(model.drag?.item===it)continue;if((p.id==='bag'&&it.where==='bag')||(p.id==='doll'&&it.where==='equipped')){let q=model.itemPosition(it);drawImage(it.icon,q.x-18,q.y-18,36,36);}}}
 if(model.drag?.kind==='item')drawImage(model.drag.item.icon,model.drag.x-20,model.drag.y-20,40,40);
 text('Arrow / WASD: tile steps    Right-drag: walk    Drag panel title: move gump',25,756,'#b7c9c8','13px system-ui');text(model.message,25,779,'#d1b77c','12px system-ui');text(`Tile ${model.tile.x}, ${model.tile.y} · ${model.actor()} · ${model.paused?'PAUSED':model.clip}`,26,82,'#abc4c9','13px system-ui');}
const toPoint=e=>{let b=canvas.getBoundingClientRect();return {x:(e.clientX-b.left)*1280/b.width,y:(e.clientY-b.top)*800/b.height}};let right=false,pointer={x:0,y:0};
canvas.oncontextmenu=e=>e.preventDefault();canvas.onpointerdown=e=>{let p=toPoint(e);pointer=p;canvas.setPointerCapture(e.pointerId);if(e.button===2)right=true;else model.begin(p.x,p.y);};canvas.onpointermove=e=>{pointer=toPoint(e);model.move(pointer.x,pointer.y);};canvas.onpointerup=e=>{let p=toPoint(e);if(e.button===2)right=false;else model.drop(p.x,p.y);};canvas.onpointercancel=()=>{model.drag=null;right=false;};window.onkeydown=e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase());};window.onkeyup=e=>keys.delete(e.key.toLowerCase());window.onblur=()=>{keys.clear();right=false;model.drag=null;};
document.querySelector('#outfit').onchange=e=>{model.teal=e.target.value==='teal';model.outfit=e.target.value==='humanoid'?'humanoid':'armor';};document.querySelector('#clip').onchange=e=>model.clip=e.target.value;const dir=document.querySelector('#dir');['N','NE','E','SE','S','SW','W','NW'].forEach((d,i)=>dir.add(new Option(d,i)));dir.value=3;dir.onchange=e=>model.direction=+e.target.value;document.querySelector('#actor').onclick=e=>{model.monster=!model.monster;e.target.textContent=model.monster?'Humanoid':'Tidehound';};document.querySelector('#pause').onclick=e=>{model.paused=!model.paused;e.target.textContent=model.paused?'Resume':'Pause';};document.querySelector('#pivots').onchange=e=>pivots=e.target.checked;
let last=0;function tick(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;model.update(dt);let sx=+(keys.has('d')||keys.has('arrowright'))-+(keys.has('a')||keys.has('arrowleft')),sy=+(keys.has('s')||keys.has('arrowdown'))-+(keys.has('w')||keys.has('arrowup'));if(right&&!model.panelAt(pointer.x,pointer.y)){let target=model.unproject(pointer.x,pointer.y);sx=Math.sign(target.x-model.tile.x);sy=Math.sign(target.y-model.tile.y);}if(sx||sy)model.step(sx,sy);frame();requestAnimationFrame(tick);}
Promise.all(Object.entries(sources).map(([p,src])=>new Promise((resolve,reject)=>{let im=new Image;im.onload=()=>{images[p]=im;resolve();};im.onerror=reject;im.src=src;}))).then(()=>{document.querySelector('#loading').remove();canvas.hidden=false;window.proofReady=true;requestAnimationFrame(tick);}).catch(e=>document.querySelector('#loading').textContent='Asset loading failed: '+e);
</script></html>
