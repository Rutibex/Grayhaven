name: Repository source integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm bundled upstream snapshots
        run: python tools/project.py verify
      - name: Confirm repository and original assets
        run: python scripts/check_repository.py
