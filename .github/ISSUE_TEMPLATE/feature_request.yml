name: Feature request
description: Propose an improvement for Greyhaven.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to see?
      description: Explain the player or developer need and the proposed change.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why does it matter?
